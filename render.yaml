# Render Blueprint for the IUNU website: Spring Boot API + managed PostgreSQL
# + the Vite frontend as a static site.
#
# Both services deploy from `main`, where pull requests are merged. This used
# to name the feature branch the blueprint was written on, which stopped
# receiving commits once it was merged - a service still following it keeps
# redeploying that old code. The branch a service actually builds from is the
# one in Render -> service -> Settings -> Build & Deploy; this value only
# reaches it when the blueprint is synced.
#
# Values marked `sync: false` are NOT stored here - Render prompts for each one
# in the dashboard when the blueprint is first applied, and keeps them out of
# the repository.

databases:
  - name: iunu-db
    plan: free
    databaseName: iunu
    user: iunu

services:
  # --- API -------------------------------------------------------------------
  - type: web
    name: iunu-api
    runtime: docker
    # A persistent disk needs a paid instance type; the free plan has none.
    plan: starter
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Uploaded project images. Survives deploys and restarts. A service with a
    # disk runs as a single instance and has no zero-downtime deploys (the
    # old instance stops before the new one starts).
    disk:
      name: iunu-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # The prod profile assembles the JDBC URL from these five.
      - key: DB_HOST
        fromDatabase:
          name: iunu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iunu-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: iunu-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: iunu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iunu-db
          property: password

      # Every request reaches the app through Render's proxy, so without this
      # the per-IP limiter keys on the proxy's address and the 10/min login
      # limit becomes one global bucket shared by every visitor.
      - key: RATE_LIMIT_TRUST_FORWARDED_HEADER
        value: "true"

      # Render generates a 256-bit value on first sync and keeps it; nothing to
      # paste, and no secret in the repository. JwtService requires >= 32 bytes.
      - key: JWT_SECRET
        generateValue: true

      # Origins allowed to call the API - the deployed frontend's URL, e.g.
      # https://iunu-web.onrender.com (scheme + host, no trailing slash, no path).
      # Wildcards are rejected at startup.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Used in password-reset links. Same origin as above.
      - key: FRONTEND_URL
        sync: false
      # Public origin of this API, e.g. https://iunu-api.onrender.com (no /api
      # suffix). Uploaded image URLs start with it: <origin>/uploads/...
      - key: PUBLIC_API_URL
        sync: false

      # Uploaded images are written here, on the persistent disk above, and
      # served from https://<api-host>/uploads/... Must be under the disk's
      # mountPath: anywhere else in the container is wiped on every deploy.
      - key: UPLOAD_DIR
        value: /var/data/uploads

      # Optional. Enables English -> Arabic auto-translation of project content
      # on save. Left unset, saves still work and the site shows English.
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false

      # Optional monitoring. Each is off while blank; see docs/MONITORING.md.
      - key: OTLP_METRICS_URL
        sync: false
      - key: OTLP_METRICS_HEADERS
        sync: false
      - key: SENTRY_DSN
        sync: false

      # One-time admin bootstrap. Set both on the first deploy, then clear them:
      # they only take effect while the database contains no ADMIN at all.
      # ADMIN_PASSWORD must be at least 8 characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # --- Frontend --------------------------------------------------------------
  - type: web
    name: iunu-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Client-side routing: every unmatched path serves the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers. Render reads them from here; Vercel reads vercel.json
    # and Netlify reads public/_headers, and this site is deployed to more than
    # one of those - so a header added to only one file protects only one
    # deployment. KEEP ALL THREE IN SYNC.
    #
    # Every CSP directive is derived from something the app actually loads
    # (Google Fonts, /uploads/ images on the backend origin, the backend
    # API). See docs/SECURITY_AUDIT.md, and re-verify in a browser after any
    # change - a wrong CSP is a white screen with no server-side error to find.
    #
    # style-src has no 'unsafe-inline': nothing in the bundle injects <style>
    # elements (React style={{}} props go through the CSSOM, which CSP allows).
    # Adding a CSS-in-JS, toast or animation library that does will need it
    # back - check the browser console for CSP violations before shipping one.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      # connect-src and img-src must name the backend origin (img-src for
      # uploaded /uploads/ images). Update both here, in vercel.json and in
      # public/_headers when the API moves to a custom domain, or the browser
      # blocks every API call and every project image.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://iunu-api.onrender.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://iunu-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

    envVars:
      # The variable the code reads is VITE_API_URL, and the value MUST include
      # the /api path segment - e.g. https://iunu-api.onrender.com/api.
      # Vite inlines it at build time, so changing it requires a rebuild.
      - key: VITE_API_URL
        sync: false
