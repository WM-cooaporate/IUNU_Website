# Render Blueprint for the IUNU website: Spring Boot API + managed PostgreSQL
# + the Vite frontend as a static site.
#
# `branch` is set to the branch this work lives on. Point both services at
# whichever branch you actually deploy from before syncing the blueprint.
#
# Values marked `sync: false` are NOT stored here - Render prompts for each one
# in the dashboard when the blueprint is first applied, and keeps them out of
# the repository.

databases:
  - name: iunu-db
    plan: free
    databaseName: iunu
    user: iunu

services:
  # --- API -------------------------------------------------------------------
  - type: web
    name: iunu-api
    runtime: docker
    plan: free
    branch: claude/dreamy-noether-6n7l8o
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # The prod profile assembles the JDBC URL from these five.
      - key: DB_HOST
        fromDatabase:
          name: iunu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iunu-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: iunu-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: iunu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iunu-db
          property: password

      # Every request reaches the app through Render's proxy, so without this
      # the per-IP limiter keys on the proxy's address and the 10/min login
      # limit becomes one global bucket shared by every visitor.
      - key: RATE_LIMIT_TRUST_FORWARDED_HEADER
        value: "true"

      # Render generates a 256-bit value on first sync and keeps it; nothing to
      # paste, and no secret in the repository. JwtService requires >= 32 bytes.
      - key: JWT_SECRET
        generateValue: true

      # Origins allowed to call the API - the deployed frontend's URL, e.g.
      # https://iunu-web.onrender.com (scheme + host, no trailing slash, no path).
      # Wildcards are rejected at startup.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Used in password-reset links. Same origin as above.
      - key: FRONTEND_URL
        sync: false
      # Public origin of this API, e.g. https://iunu-api.onrender.com (no /api
      # suffix). Legacy /uploads/ image URLs start with it; the "Move images to
      # cloud" migration uses it to find them.
      - key: PUBLIC_API_URL
        sync: false

      # Image storage + CDN. The prod profile uses Cloudinary by default and
      # REFUSES TO START without CLOUDINARY_URL - set it before deploying.
      # cloudinary://<api_key>:<api_secret>@<cloud_name>, from the Cloudinary
      # dashboard -> API Keys -> "API environment variable". Backend only:
      # never on the static site, never a VITE_ variable. See ENV_VARS.md.
      - key: CLOUDINARY_URL
        sync: false
      # Everything this environment uploads, deletes or sweeps lives here.
      - key: CLOUDINARY_FOLDER
        value: iunu/prod

      # Only used by the local storage provider (FILE_STORAGE_PROVIDER=local)
      # and by the one-off migration of legacy /uploads/ files. The free plan
      # has no persistent disk, so anything written here is lost on redeploy.
      - key: UPLOAD_DIR
        value: /tmp/uploads

      # Optional. Enables English -> Arabic auto-translation of project content
      # on save. Left unset, saves still work and the site shows English.
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false

      # Optional monitoring. Each is off while blank; see docs/MONITORING.md.
      - key: OTLP_METRICS_URL
        sync: false
      - key: OTLP_METRICS_HEADERS
        sync: false
      - key: SENTRY_DSN
        sync: false

      # One-time admin bootstrap. Set both on the first deploy, then clear them:
      # they only take effect while the database contains no ADMIN at all.
      # ADMIN_PASSWORD must be at least 8 characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # --- Frontend --------------------------------------------------------------
  - type: web
    name: iunu-web
    runtime: static
    branch: claude/dreamy-noether-6n7l8o
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Client-side routing: every unmatched path serves the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers. Render reads them from here; Vercel reads vercel.json
    # and Netlify reads public/_headers, and this site is deployed to more than
    # one of those - so a header added to only one file protects only one
    # deployment. KEEP ALL THREE IN SYNC.
    #
    # Every CSP directive is derived from something the app actually loads
    # (Google Fonts, Cloudinary and legacy /uploads/ images, the backend
    # origin). See docs/SECURITY_AUDIT.md, and re-verify in a browser after any
    # change - a wrong CSP is a white screen with no server-side error to find.
    #
    # style-src has no 'unsafe-inline': nothing in the bundle injects <style>
    # elements (React style={{}} props go through the CSSOM, which CSP allows).
    # Adding a CSS-in-JS, toast or animation library that does will need it
    # back - check the browser console for CSP violations before shipping one.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      # connect-src and img-src must name the backend origin (img-src for
      # legacy /uploads/ images). Update both here, in vercel.json and in
      # public/_headers when the API moves to a custom domain, or the browser
      # blocks every API call. img-src also names Cloudinary's delivery host;
      # the dashboard only accepts pasted image URLs from these origins.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://res.cloudinary.com https://iunu-api.onrender.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://iunu-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

    envVars:
      # The variable the code reads is VITE_API_URL, and the value MUST include
      # the /api path segment - e.g. https://iunu-api.onrender.com/api.
      # Vite inlines it at build time, so changing it requires a rebuild.
      - key: VITE_API_URL
        sync: false
