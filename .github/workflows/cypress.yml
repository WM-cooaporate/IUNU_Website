# End-to-end smoke tests: the production build (vite build + vite preview)
# driven by Cypress. No backend runs here - every API call is stubbed with
# cy.intercept and the fixtures in cypress/fixtures, so these prove the
# frontend renders and navigates. Backend behaviour is the JUnit suite's job
# (ci.yml). Run locally with `npm run build && npm run preview`, then
# `npm run cy:run`.
name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress (stubbed API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Vite inlines this at build time. Nothing listens on it in CI: every
      # request to it is intercepted by the specs.
      VITE_API_URL: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: cypress-io/github-action@v7
        with:
          build: npm run build
          start: npm run preview
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
