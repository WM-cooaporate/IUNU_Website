# Gates every push and pull request to main.
#
# Every job here is something a contributor can run locally; see the root
# README and security/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Includes MigrationSchemaTest and RefreshTokenRacePostgresTest against
      # a real PostgreSQL through Testcontainers (Docker is on the runner).
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify
      - name: Fail if the PostgreSQL tests were skipped
        # They are disabledWithoutDocker, so a Docker problem shows up as
        # "skipped", not as a failure. On CI that is never acceptable.
        working-directory: backend
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*Postgres*.xml target/surefire-reports/TEST-*MigrationSchemaTest.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "PostgreSQL tests skipped: $skipped"
          test "$skipped" = "0"

  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The Docker image rather than gitleaks-action, which needs a paid
      # licence on organisation accounts.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  headers-sync:
    name: Security headers in sync (M12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node security/check-headers-sync.mjs
