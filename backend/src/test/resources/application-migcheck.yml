# Runs the real Flyway migrations against H2 in MySQL-compatibility mode so
# the projects DDL is exercised, not just the entity-generated schema.
#
# Hibernate's ddl-auto=validate is deliberately OFF here: H2 reports a MySQL
# TEXT column as VARCHAR, which validate flags on every TEXT column in the
# schema (including pre-existing ones). Column presence/typing is asserted
# from INFORMATION_SCHEMA instead - see MigrationSchemaTest.
spring:
  datasource:
    url: jdbc:h2:mem:migcheck;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
