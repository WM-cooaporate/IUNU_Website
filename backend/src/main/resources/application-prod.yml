# Production profile (SPRING_PROFILES_ACTIVE=prod), targeting Render.
#
# Every value here is required with NO default: a missing variable must stop
# the container at startup rather than let it come up silently pointing at a
# development database, signing tokens with an empty secret, or writing
# uploads somewhere that vanishes on the next deploy.
server:
  # Render injects PORT and routes to it.
  port: ${PORT:8080}
  # NONE, deliberately. Both other strategies rewrite the client address from
  # X-Forwarded-For before ClientIpResolver sees the request: "framework"
  # takes the LEFTMOST entry - the one the caller typed - and "native" does the
  # same whenever every hop counts as trusted. Either hands an attacker their
  # own rate-limit bucket; the attack lab sent 360 requests with a rotating
  # fake X-Forwarded-For and got no 429 at all (N6 in docs/SECURITY_AUDIT.md).
  #
  # The one thing this setting was here for - knowing the request was HTTPS,
  # so HSTS is sent - is done by ForwardedProtoFilter, which reads only
  # X-Forwarded-Proto and only from TRUSTED_PROXIES.
  forward-headers-strategy: none
  # Also set in application.yml; stated here too so the production profile is
  # safe on its own even if the base file changes. No stack traces, exception
  # messages or binding details in any error response, and no whitelabel HTML
  # page - Tomcat's own error page (server info and report hidden) instead.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  datasource:
    # Assembled from the five properties render.yaml pulls off the managed
    # database, rather than one DB_URL, so no credential is duplicated by hand.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Render's free Postgres allows few connections and the free instance has
      # 0.1 CPU; a small pool is the realistic ceiling, not a throttle. Raising
      # this above the plan's connection limit does not buy throughput - it
      # turns a slow request into a failed one.
      maximum-pool-size: ${DB_POOL_MAX:${DB_POOL_SIZE:5}}

  # Same limits as application.yml, pinned for production: 5MB per file (the
  # dashboard sends 200-600KB WebP), 25MB per multi-image request. Anything
  # bigger is a 413 from GlobalExceptionHandler.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

  security:
    # Superseded by app.client-ip.mode below; kept because an existing Render
    # deployment sets it and a release must not silently change how the limiter
    # keys requests. When CLIENT_IP_MODE is unset, true here means
    # x-forwarded-for. render.yaml sets it to true.
    trust-forwarded-header: ${RATE_LIMIT_TRUST_FORWARDED_HEADER:false}

  client-ip:
    # Behind Render's proxy every request arrives from the proxy's address, so
    # the per-IP limits are only meaningful if X-Forwarded-For is read - and
    # only from the right-hand side, which is what the proxy actually wrote.
    #
    # Switch to `cloudflare` ONLY after traffic is proxied through Cloudflare
    # AND the origin is closed to direct access (EDGE_SHARED_SECRET). Until
    # then CF-Connecting-IP is a header anyone can send.
    mode: ${CLIENT_IP_MODE:x-forwarded-for}
    # One hop: Render's own proxy. Two once Cloudflare is in front of it.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
    # Strongly recommended: without it the forwarding header is honoured from
    # any peer, so anything that can reach this process directly can choose its
    # own rate-limit bucket. Set it to Render's internal proxy range. Startup
    # logs a WARN while it is unset.
    trusted-proxies: ${TRUSTED_PROXIES:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  file-storage:
    # Uploaded images live on the Render persistent disk mounted at /var/data
    # (render.yaml -> iunu-api -> disk). Anywhere else in the container is
    # wiped on every deploy and restart. LocalImageStorage refuses to start
    # if this directory cannot be created or written.
    location: ${UPLOAD_DIR:/var/data/uploads}
    public-base-url: ${PUBLIC_API_URL}

  frontend-url: ${FRONTEND_URL}

# Exposure is inherited from application.yml (health, info, metrics,
# prometheus, caches) rather than narrowed back to health here. During an
# incident /actuator/metrics is how you tell "we are being flooded" from "the
# database is the bottleneck", and it is reachable only with an ADMIN token -
# see SecurityConfig. Only the health probes are anonymous, and they say
# nothing but UP or DOWN.
management:
  endpoint:
    health:
      show-details: never
