# Production profile (SPRING_PROFILES_ACTIVE=prod), targeting Render.
#
# Every value here is required with NO default: a missing variable must stop
# the container at startup rather than let it come up silently pointing at a
# development database, signing tokens with an empty secret, or writing
# uploads somewhere that vanishes on the next deploy.
server:
  # Render injects PORT and routes to it.
  port: ${PORT:8080}
  # TLS terminates at Render's edge proxy, so without this Spring sees plain
  # HTTP and builds http:// redirect/absolute URLs for an https:// site.
  forward-headers-strategy: framework

spring:
  datasource:
    # Assembled from the five properties render.yaml pulls off the managed
    # database, rather than one DB_URL, so no credential is duplicated by hand.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Render's free Postgres allows few connections and the free instance has
      # 0.1 CPU; a small pool is the realistic ceiling, not a throttle. Raising
      # this above the plan's connection limit does not buy throughput - it
      # turns a slow request into a failed one.
      maximum-pool-size: ${DB_POOL_MAX:${DB_POOL_SIZE:5}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

  security:
    # Superseded by app.client-ip.mode below; kept because an existing Render
    # deployment sets it and a release must not silently change how the limiter
    # keys requests. When CLIENT_IP_MODE is unset, true here means
    # x-forwarded-for. render.yaml sets it to true.
    trust-forwarded-header: ${RATE_LIMIT_TRUST_FORWARDED_HEADER:false}

  client-ip:
    # Behind Render's proxy every request arrives from the proxy's address, so
    # the per-IP limits are only meaningful if X-Forwarded-For is read - and
    # only from the right-hand side, which is what the proxy actually wrote.
    #
    # Switch to `cloudflare` ONLY after traffic is proxied through Cloudflare
    # AND the origin is closed to direct access (EDGE_SHARED_SECRET). Until
    # then CF-Connecting-IP is a header anyone can send.
    mode: ${CLIENT_IP_MODE:x-forwarded-for}
    # One hop: Render's own proxy. Two once Cloudflare is in front of it.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  file-storage:
    # On Render's free plan there is no persistent disk, so this is ephemeral
    # and uploaded cover images are lost on every deploy and on every restart
    # of a spun-down instance. Attach a Render Disk (paid) and point UPLOAD_DIR
    # at its mount path to make uploads survive. See ENV_VARS.md.
    location: ${UPLOAD_DIR}
    public-base-url: ${PUBLIC_API_URL}

  frontend-url: ${FRONTEND_URL}

# Exposure is inherited from application.yml (health, info, metrics,
# prometheus, caches) rather than narrowed back to health here. During an
# incident /actuator/metrics is how you tell "we are being flooded" from "the
# database is the bottleneck", and it is reachable only with an ADMIN token -
# see SecurityConfig. Only the health probes are anonymous, and they say
# nothing but UP or DOWN.
management:
  endpoint:
    health:
      show-details: never
