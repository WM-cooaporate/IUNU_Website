server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # A header larger than this is refused before it is buffered. The default is
  # 8KB; 16KB leaves room for a long Authorization header plus Cloudflare's own
  # headers without leaving the door open to header-stuffing.
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      # The ceiling on concurrent in-flight requests. Every thread over this is
      # queued, not dropped. Keep it well above DB_POOL_MAX: threads waiting on
      # the pool are cheap, threads that cannot exist mean refused connections.
      max: ${TOMCAT_MAX_THREADS:100}
    # Connections waiting for a thread. Beyond this the OS refuses the TCP
    # connection, which is the correct failure - a refused connection is a fast
    # error a client can retry, an accepted one that times out is a held resource.
    accept-count: 100
    # Bytes of an aborted request body Tomcat will read and discard. Without a
    # cap, rejecting a large upload still means reading all of it.
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB
    # Slowloris: a client that opens a connection and sends one byte a minute
    # holds a thread indefinitely. Enough of those and the pool is gone without
    # a single complete request. These two put a clock on it.
    connection-timeout: 10s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100

spring:
  application:
    name: real-estate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iunu_real_estate}
    username: ${DB_USERNAME:iunu}
    password: ${DB_PASSWORD:}
    hikari:
      # Must stay BELOW the database plan's connection limit, counting every
      # instance and every other client (migrations, a psql session, a backup
      # job). Exceeding it does not degrade - the database refuses new
      # connections and the app 500s. See ENV_VARS.md.
      # DB_POOL_SIZE is the older name for this, still honoured.
      maximum-pool-size: ${DB_POOL_MAX:${DB_POOL_SIZE:10}}
      minimum-idle: 2
      # Fail fast rather than queue forever. Under load the useful answer is
      # "the database is saturated" after 5 seconds, not a request thread held
      # for 20 while the queue behind it grows.
      connection-timeout: 5000
      # Below the idle timeout managed Postgres providers apply (commonly 30
      # minutes), so the pool retires a connection before the server kills it
      # and hands out a dead one.
      max-lifetime: 1500000
      # Logs a stack trace for a connection held longer than this. Catches the
      # "slow endpoint holds a connection across a network call" class of bug,
      # which is invisible until it exhausts the pool under load.
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      # Flyway (below) owns the schema. Hibernate only ever validates it
      # matches the entities - it must never auto-generate/alter DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # A public endpoint that takes a page size takes "give me the whole table"
  # unless it is capped. This is a performance fix and a DoS fix at once: one
  # request for ?size=100000 costs more than a thousand normal ones.
  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 50

  # @Async work - today only the admin new-sign-in email. Bounded, so a
  # stuck SMTP server fills a small queue and then fails loudly rather than
  # growing an unbounded one in the heap.
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100

  servlet:
    multipart:
      # Matches what LocalImageStorage is willing to hold in memory per file.
      max-file-size: 5MB
      # Raised from 5MB so the dashboard can send several images in one
      # request; the per-file cap above is what actually bounds a single upload.
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
    issuer: ${JWT_ISSUER:iunu-real-estate-api}

  security:
    max-failed-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${ACCOUNT_LOCK_DURATION_MINUTES:15}
    reset-token-expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:30}
    refresh-token-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}
    # A rotated refresh token presented again within this many seconds is a
    # plain 401 (two tabs refreshing at once). After it, the replay is treated
    # as theft: every live token of that user is revoked and
    # REFRESH_REUSE_DETECTED is raised. See AuthServiceImpl.refresh().
    refresh-reuse-grace-seconds: ${APP_SECURITY_REFRESH_REUSE_GRACE_SECONDS:10}
    # Superseded by app.client-ip.mode below, which distinguishes the three
    # deployments this app can be in instead of one boolean. Still read, so an
    # existing deployment that sets it keeps working: when app.client-ip.mode
    # is unset, true here means x-forwarded-for. See ClientIpResolver.
    trust-forwarded-header: ${RATE_LIMIT_TRUST_FORWARDED_HEADER:${TRUST_FORWARDED_HEADER:false}}

    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Bucket store ceiling. Bounded so a flood from many addresses cannot
      # grow it until the JVM runs out of memory.
      max-tracked-clients: ${RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}

    # Largest non-multipart request body accepted, checked against
    # Content-Length before anything reads the stream. See ContentLengthLimitFilter.
    max-json-request-bytes: ${MAX_JSON_REQUEST_BYTES:1048576}

    events:
      # Ceiling on the (type, client IP) pairs the SECURITY log remembers for
      # its once-a-minute sampling. Bounded for the same reason as the rate
      # limiter's bucket store. See SecurityEvents.
      max-sampled-clients: 10000

  # Admin audit trail (audit_log). Rows older than this are purged nightly.
  audit:
    retention-days: ${APP_AUDIT_RETENTION_DAYS:365}

  # Which address the per-IP rate limits key on. Getting this wrong silently
  # breaks the limiter in one of two directions - see ClientIpResolver.
  #   remote-addr    : no proxy. Local development.
  #   x-forwarded-for: Render/Railway with no Cloudflare.
  #   cloudflare     : proxied through Cloudflare AND the origin is locked to it.
  client-ip:
    mode: ${CLIENT_IP_MODE:}
    # How many proxies sit in front of this app. The entry this far from the
    # RIGHT of X-Forwarded-For is the real client; entries further left are
    # caller-controlled.
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
    # Comma-separated addresses or CIDR blocks. Forwarding headers are honoured
    # ONLY from a peer inside one of these; anything else falls back to the
    # socket address.
    #
    # This is what makes the header trustworthy. "The last X-Forwarded-For entry
    # is the real client" holds only if a proxy appended it - a request that
    # reaches this process directly carries whatever the caller typed, end to
    # end, and can therefore pick its own rate-limit bucket. The socket address
    # is the one part of a request nobody can forge, so it is what decides
    # whether the rest is believable.
    #
    # Blank keeps the older behaviour (trust any peer) and logs a WARN at
    # startup. Find the value by checking the platform's docs for its proxy
    # range, or by logging getRemoteAddr() on a real request once.
    trusted-proxies: ${TRUSTED_PROXIES:}

  edge:
    # Blank = disabled. Set this ONLY after a Cloudflare Transform Rule is
    # injecting the matching X-Edge-Auth header, or the API goes dark.
    # See docs/DDOS_RUNBOOK.md.
    shared-secret: ${EDGE_SHARED_SECRET:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Auto-translation of admin-authored project copy into Arabic. Optional:
  # with no api-key the feature switches itself off and the site falls back to
  # the English text. The key is server-side only - it is never exposed to the
  # browser and never placed in a URL.
  translation:
    google:
      api-key: ${GOOGLE_TRANSLATE_API_KEY:}
      base-url: ${GOOGLE_TRANSLATE_BASE_URL:https://translation.googleapis.com}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      # Characters per UTC day, across every caller. Google bills per character,
      # so a loop over the preview or backfill endpoint is a loop over the
      # client's credit card. Past this the translator behaves as if it were
      # switched off: saves still succeed, the site falls back to English.
      #
      # This is a backstop, not the real cap. The real cap is a quota and a
      # budget alert in the Google Cloud Console - this one only binds while
      # this process is alive, and resets on every deploy.
      daily-char-limit: ${GOOGLE_TRANSLATE_DAILY_CHAR_LIMIT:200000}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  file-storage:
    location: ${UPLOAD_LOCATION:uploads}
    public-base-url: ${PUBLIC_API_URL:http://localhost:8080}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@iunu-eg.com}

management:
  endpoints:
    web:
      exposure:
        # Exposing an endpoint here does not publish it: SecurityConfig gates
        # everything under /actuator except the health probes behind ADMIN.
        # Both layers have to agree before anything becomes reachable.
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      # Anonymous callers get UP or DOWN and nothing else - no component names,
      # no database host, no error text.
      show-details: never
      probes:
        enabled: true
  metrics:
    distribution:
      # Percentiles computed in-process, so a load test can read p95/p99 per
      # endpoint straight off /actuator/metrics without a Prometheus server.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: iunu-backend
  # Push to a hosted metrics backend (Grafana Cloud, or anything that speaks
  # OTLP). Enabled only when OTLP_METRICS_URL is set - see
  # OptionalIntegrationsEnvironmentPostProcessor, which also reads
  # OTLP_METRICS_HEADERS for the auth header.
  otlp:
    metrics:
      export:
        step: 60s
        # Seconds rather than the OTLP registry's default milliseconds, so the
        # names the backend derives (http_server_requests_seconds_bucket, ...)
        # are the same as an /actuator/prometheus scrape - and the same as
        # monitoring/alert-rules.yml expects.
        base-time-unit: seconds
  health:
    # The mail indicator opens an SMTP connection to MAIL_HOST on every probe.
    # With mail disabled (the default) there is nothing listening, so it reports
    # DOWN and drags the aggregate status down with it - which on a platform
    # that gates releases on /actuator/health means the deploy never goes live.
    # Whether outbound email works is not a liveness condition for this API;
    # app.mail.enabled already governs whether it is used at all.
    mail:
      enabled: false

# Interactive API docs. Default OFF and opt-in, rather than on with a
# production override: a deploy that forgets SPRING_PROFILES_ACTIVE must not
# publish the full shape of every admin endpoint to anonymous visitors. Set
# SWAGGER_ENABLED=true for local development or for a scheduled ZAP scan.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Backend error tracking. Off unless SENTRY_DSN is set (Spring reads it as
# sentry.dsn). SentryConfig strips credentials, cookies and bodies from every
# event before it leaves.
sentry:
  send-default-pii: false
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active:default}}
  # Errors only. traces-sample-rate is deliberately absent: setting it at all,
  # even to 0, switches on Sentry's tracing configuration.

logging:
  level:
    root: INFO
    com.iunu.realestate: INFO
    org.springframework.security: WARN
    # Security events (SecurityEvents). Stated rather than inherited from root,
    # so quietening the root logger can never silence them.
    SECURITY: INFO
